name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: |
          npm install
          echo "--- node_modules contents ---"
          ls node_modules/@capacitor/ || echo "No capacitor modules"

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          echo "--- Verify capacitor-cordova-android-plugins ---"
          ls android/capacitor-cordova-android-plugins/ || echo "Missing!"
          echo "--- Verify web assets ---"
          ls android/app/src/main/assets/public/index.html || echo "Missing!"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WorkSense-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
